name: CI

# `nix flake check` is the whole gate: it builds the renderer (running its Go
# tests) and the sink on x86_64, cross-compiles both for aarch64, checks that
# overlays.default uses the consumer's rpi-rgb-led-matrix, and checks
# formatting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check
        run: nix flake check --print-build-logs
